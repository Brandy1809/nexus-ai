name: tests

# Har push/PR par jaanch. Agent ke AI-prastaav wale PR par bhi chalti hai.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests.py
